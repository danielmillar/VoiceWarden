# An omitted rule stays at Detekt's default, and most defaults are on. The active: false lines keep this file to dividers and to forbidding a suppression of that check.
comments:
  active: false
complexity:
  active: false
coroutines:
  active: false
empty-blocks:
  active: false
exceptions:
  active: false
naming:
  active: false
performance:
  active: false
potential-bugs:
  active: false
style:
  active: true
  AlsoCouldBeApply:
    active: false
  BracesOnIfStatements:
    active: false
  BracesOnWhenStatements:
    active: false
  CanBeNonNullable:
    active: false
  CascadingCallWrapping:
    active: false
  ClassOrdering:
    active: false
  CollapsibleIfStatements:
    active: false
  DataClassContainsFunctions:
    active: false
  DataClassShouldBeImmutable:
    active: false
  DestructuringDeclarationWithTooManyEntries:
    active: false
  DoubleNegativeLambda:
    active: false
  EqualsNullCall:
    active: false
  EqualsOnSignatureLine:
    active: false
  ExplicitCollectionElementAccessMethod:
    active: false
  ExplicitItLambdaParameter:
    active: false
  ExpressionBodySyntax:
    active: false
  ForbiddenAnnotation:
    active: false
  ForbiddenComment:
    active: true
    comments:
      - reason: 'This comment is a divider. Delete it. A section name belongs in the code, not in a banner.'
        value: '(?-s)^[ \t]*[=\-*#~_]{4,}[ \t]*$'
      - reason: 'This comment is a divider. Delete it. A section name belongs in the code, not in a banner.'
        value: '(?-s)^[ \t]*[=\-*#~_]{3,}[ \t]+\S.*\S[ \t]+[=\-*#~_]{3,}[ \t]*$'
      - reason: 'This comment is a divider. Delete it. A section name belongs in the code, not in a banner.'
        value: '(?-s)^[ \t]*[=\-*#~_]{3,}(?:[ \t]+[=\-*#~_]{3,})+[ \t]*$'
  ForbiddenImport:
    active: false
  ForbiddenMethodCall:
    active: false
  ForbiddenSuppress:
    active: true
    rules:
      - 'ForbiddenComment'
  ForbiddenVoid:
    active: false
  FunctionOnlyReturningConstant:
    active: false
  LoopWithTooManyJumpStatements:
    active: false
  MagicNumber:
    active: false
  MandatoryBracesLoops:
    active: false
  MaxChainedCallsOnSameLine:
    active: false
  MaxLineLength:
    active: false
  MayBeConst:
    active: false
  ModifierOrder:
    active: false
  MultilineLambdaItParameter:
    active: false
  MultilineRawStringIndentation:
    active: false
  NestedClassesVisibility:
