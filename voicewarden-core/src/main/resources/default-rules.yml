  doxxing:
    enabled: true
    category: "Possible doxxing"
    severity: MILD
    words: []
    phrases:
      - my address is
      - his address is
      - her address is
      - their address is
      - home address is
      - phone number is
      - ip address is
      - social security number
    regex:
      - '\b(?:(?:25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)\.){3}(?:25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)\b'
      - '\b[\p{L}\p{N}._%+-]+@[\p{L}\p{N}-]+(?:\.[\p{L}\p{N}-]+)+\b'
      - '\b[\p{L}\p{N}]+\s+at\s+(?:gmail|yahoo|outlook|hotmail|icloud|protonmail)\s+dot\s+(?:com|net|org|co)\b'
      - '(?<![\p{L}\p{N}])(?:\+?\d{1,3}[\s.-])?(?:\(\d{3}\)|\d{3})[\s.-]\d{3}[\s.-]\d{4}(?![\p{L}\p{N}])'
      - '(?<![\p{L}\p{N}])\d{3}-\d{4}(?![\p{L}\p{N}])'
      - '(?<![\p{L}\p{N}])\d{10,15}(?![\p{L}\p{N}])'
      - '\b(?:(?:zero|oh|one|two|three|four|five|six|seven|eight|nine)[\s,.-]+){6,14}(?:zero|oh|one|two|three|four|five|six|seven|eight|nine)\b'
    exclude_regex: []
    allow:
      - "127.0.0.1"
      - "0.0.0.0"
      - "192.168.0.1"
      - "192.168.1.1"

