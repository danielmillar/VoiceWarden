# VoiceWarden moderation rules (phrases, regex, allowlists and contextual guards).
#
# Loaded alongside config/wordlist.txt and reloaded on /vw reload.
# Every rule targets one of the three severity tiers configured in config.yml:
#   MILD     -> moderation.escalation.mild     (default: report -> warn -> mute)
#   MODERATE -> moderation.escalation.moderate (default: warn -> mute)
#   SEVERE   -> moderation.escalation.severe   (default: immediate mute)
#
# Matching notes:
# - Words and phrases are compiled into a single Aho-Corasick trie with wordlist.txt.
# - Internal apostrophes are folded for phrase matching so "you're", "I'll" and "don't"
#   match "youre", "ill" and "dont" automatically.
# - Regex patterns run case-insensitively with Unicode case folding, fast literal prefilters,
#   and a strict per-rule time budget to prevent backtracking stalls.
# - exclude_regex suppresses a rule when the utterance matches a safe context (for example,
#   reporting or condemning prohibited content).
# - allowlist applies globally to wordlist and rule word/phrase hits; per-rule allow also
#   suppresses regex hits for that rule.

