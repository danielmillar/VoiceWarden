name: VoiceWarden
version: '${version}'
main: dev.danielmillar.voicewarden.VoiceWardenPlugin
api-version: '26.2'
description: 'Real-time, fully local voice chat moderation for Simple Voice Chat.'
author: danielmillar
website: https://github.com/danielmillar
dependencies:
  server:
    voicechat:
      load: BEFORE
      required: true
      join-classpath: true
    LuckPerms:
      load: BEFORE
      required: true
      join-classpath: true
permissions:
  voicewarden.admin:
    description: Full access to VoiceWarden commands (does not include bypass).
    default: op
    children:
      voicewarden.alerts: true
      voicewarden.reload: true
      voicewarden.stats: true
      voicewarden.vcmute: true
      voicewarden.report.review: true
  voicewarden.bypass:
    description: Voice is never transcribed or moderated, and the player cannot be voice-muted.
    default: false
  voicewarden.alerts:
    description: Receive in-game alerts when voice is flagged.
    default: op
  voicewarden.reload:
    description: Use /voicewarden reload.
    default: op
  voicewarden.stats:
    description: Use /voicewarden stats.
    default: op
  voicewarden.vcmute:
    description: Use /voicewarden vcmute, unvcmute, mutes and offenses.
    default: op
  voicewarden.report:
    description: Use /reportvoice to report a player's voice chat.
    default: true
  voicewarden.report.review:
    description: Receive voice report alerts and use /viewreport, /reportinbox and /voicewarden history.
    default: op
