name: NevusVoice
version: '${version}'
main: dev.danielmillar.nevusvoice.NevusVoicePlugin
api-version: '26.1'
description: 'Real-time, fully local voice chat moderation for Simple Voice Chat.'
author: danielmillar
website: https://github.com/danielmillar
dependencies:
  server:
    voicechat:
      load: BEFORE
      required: true
      join-classpath: true
    LuckPerms:
      load: BEFORE
      required: true
      join-classpath: true
permissions:
  nevusvoice.admin:
    description: Full access to NevusVoice commands (does not include bypass).
    default: op
    children:
      nevusvoice.alerts: true
      nevusvoice.reload: true
      nevusvoice.stats: true
      nevusvoice.vcmute: true
      nevusvoice.report.review: true
  nevusvoice.bypass:
    description: Voice is never transcribed or moderated, and the player cannot be voice-muted.
    default: false
  nevusvoice.alerts:
    description: Receive in-game alerts when voice is flagged.
    default: op
  nevusvoice.reload:
    description: Use /nevusvoice reload.
    default: op
  nevusvoice.stats:
    description: Use /nevusvoice stats.
    default: op
  nevusvoice.vcmute:
    description: Use /nevusvoice vcmute, unvcmute, mutes and offenses.
    default: op
  nevusvoice.report:
    description: Use /reportvoice to report a player's voice chat.
    default: true
  nevusvoice.report.review:
    description: Receive voice report alerts and use /viewreport, /reportinbox and /nevusvoice history.
    default: op
