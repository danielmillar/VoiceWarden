  # Requests/offers involving exploitation material are high-severity matches.
  # Reporting, prohibition and condemnation words downgrade to the child-safety review alert.
  # Whole-utterance negative guard avoids muting "don't share child porn" or "report anyone selling CSAM".
  child-exploitation:
