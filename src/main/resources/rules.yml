# VoiceWarden matches the ORIGINAL speech transcript and keeps the matched text for staff review.
# Words/phrases ignore case, accents and punctuation; internal apostrophes disappear (you're = youre).
# Wildcards apply to whole words: word* (prefix), *word (suffix), *word* (substring).
# FLAG alerts staff; MUTE also contributes weight towards the configured auto-mute threshold.
# Overlapping hits count once: MUTE wins, then greater weight, longer text, then earlier position.
# Regex runs against original text, with Unicode case-insensitive matching and a 50 ms time budget.
# Curated English rules. MUTE is reserved for explicit abuse; ambiguous speech is FLAG for staff review.
# Recognition variants are alerts: never auto-mute innocent homophones such as "bigger" or "nagger".
# Each non-overlapping MUTE match contributes its rule's weight to the flag threshold.

# Exact words protected from word patterns, including patterns used inside phrases.
# Regex rules are independent of this list. Extend it when adding broader wildcard patterns.
allowlist:
  - assassin
  - assassins
  - assassination
  - class
  - classes
  - classic
  - classical
  - grass
  - grassy
  - scunthorpe
  - cocktail
  - cocktails
