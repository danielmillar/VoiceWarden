    category: Child exploitation solicitation
    action: MUTE
    weight: 3
    words: []
    phrases: []
    regex:
      - '\A(?![\s\S]*\b(?:dont|don[''’]t|not|never|stop|report(?:ed|ing)?|illegal|disgusting|ban(?:ned)?|against)\b)[\s\S]*?\b(?:send|share|trade|sell|buy|upload|post|distribute|download|watch|want|looking\s+for)\s+(?:(?:me|us|some|your|the|more|with\s+me)\s+){0,3}(?:child\s+porn(?:ography)?|childporn|kiddie\s+porn|underage\s+(?:porn(?:ography)?|nudes?)|minor\s+nudes?|csam|csem)\b'
