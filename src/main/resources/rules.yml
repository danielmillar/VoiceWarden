  # Detect invitations and written/spoken server domains. Domains can also occur innocently.
  # YAML single quotes preserve regex backslashes. Add/remove TLDs to suit your community.
  advertising:
    enabled: true
    category: Advertising
    action: FLAG
    weight: 1
    words: []
    phrases:
      - join my server
      - join our server
      - come to my server
      - come to our server
      - join my discord
      - join our discord
      - use my referral code
    regex:
      - '\b(?:[\p{L}\p{N}](?:[\p{L}\p{N}-]{0,61}[\p{L}\p{N}])?\.)+(?:com|net|org|gg|io|co|uk|me|xyz|online|games)\b'
      - '\b(?:[\p{L}\p{N}][\p{L}\p{N}-]*\s+dot\s+)+(?:com|net|org|gg|io|co|uk|me|xyz|online|games)\b'
    allow: []

  # In-game combat talk is ambiguous; staff review, not an automatic mute.
  threats:
