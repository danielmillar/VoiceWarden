  # Bounded separators and whole-token boundaries prevent matches inside ordinary words.
  # Letter-by-letter speech (e.g. "N I G G E R") is also handled by the word matcher.
  obfuscated-slurs:
    enabled: true
    category: Obfuscated slurs
    action: MUTE
    weight: 1
    words: []
    phrases: []
    regex:
      - '(?<![\p{L}\p{N}])(?!n(?:igger|igga)s?\b)n[._-]{0,2}[i1!][._-]{0,2}g[._-]{0,2}g[._-]{0,2}(?:[e3][._-]{0,2}r|[a4@])[s5]?(?![\p{L}\p{N}])'
      - '(?<![\p{L}\p{N}])(?!faggots?\b)f[._-]{0,2}[a4@][._-]{0,2}g[._-]{0,2}g[._-]{0,2}[o0][._-]{0,2}t[s5]?(?![\p{L}\p{N}])'
      - '(?<![\p{L}\p{N}])(?!kikes?\b)k[._-]{0,2}[i1!][._-]{0,2}k[._-]{0,2}[e3][s5]?(?![\p{L}\p{N}])'
    allow: []

  # Fused ASR words appeared in the test incidents. Flag them without treating uncertain recognition as proof.
  recognition-variants:
    enabled: true
    category: Possible slur / speech recognition variant
    action: FLAG
    weight: 1
    words: ['*nigger*', '*nigga*', '*negger', nibba, nibbas, nibber, nibbers]
    phrases:
      - nig ger
      - nig gah
      - nig ga
      - fag got
      - n word
      - the nword
      - f slur
    regex: []
    allow: [snigger, sniggers, sniggered, sniggering, sniggeringly, sniggerer, sniggerers, schwarzenegger]

  # Potential personal information: staff review only, because sharing one's own details is possible.
  # Recognises 7-15 digit tokens, or spoken digit names (zero/oh/one/.../nine); not arbitrary numbers.
  doxxing:
    enabled: true
    category: Possible doxxing
    action: FLAG
    weight: 1
    words: []
    phrases: []
    regex:
      - '\bmy\s+address\s+is\b'
      - '(?<![\p{L}\p{N}])(?:\d[\s().-]*){6,14}\d(?![\p{L}\p{N}]|[\s().-]*\d)'
      - '\b(?:(?:zero|oh|one|two|three|four|five|six|seven|eight|nine)[\s,.-]+){6,14}(?:zero|oh|one|two|three|four|five|six|seven|eight|nine)\b(?![\s,.-]+(?:zero|oh|one|two|three|four|five|six|seven|eight|nine)\b)'
    allow: []
